<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Covers — Leonardo Rosell</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="covers-body">

    <main class="covers-page">

        <div class="covers-nav">
            <span>03 COVERS</span>
            <a href="index.html">BACK</a>
        </div>


        <div class="covers-stage">

            <div class="covers-stack" id="coversStack"></div>


            <!-- ARROWS -->

            <div class="covers-controls">

                <button
                    class="cover-arrow"
                    id="coverPrevious"
                    type="button"
                    aria-label="Previous cover"
                >
                    ↑
                </button>

                <button
                    class="cover-arrow"
                    id="coverNext"
                    type="button"
                    aria-label="Next cover"
                >
                    ↓
                </button>

            </div>

        </div>


        <div class="covers-footer">

            <span id="coversCounter">
                01 / 03
            </span>

            <span id="coversTitle"></span>

        </div>

    </main>


    <script src="covers.js"></script>

</body>

</html>
